<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>اللواء 54 عمالقة</title>
  <style>
    :root {
      --bg: #eef1ef;
      --panel: #f6f7f6;
      --card: #ffffff;
      --green: #1e7a34;
      --green-dark: #165b28;
      --green-soft: #dfeee4;
      --line: #dfe5df;
      --muted: #6b726c;
      --red: #d64a4a;
      --red-soft: #fbe3e3;
      --blue: #2d7be8;
      --blue-soft: #eaf2ff;
      --yellow: #f3c768;
      --yellow-soft: #fdf3d9;
      --text: #1d1d1d;
      --shadow: 0 12px 28px rgba(15, 40, 20, 0.16);
      --radius: 14px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text); font-family: Tahoma, Arial, sans-serif; }
    body { overscroll-behavior: none; }
    button, input, select { font: inherit; }
    a { text-decoration: none; color: inherit; }
    .hidden { display: none !important; }

    .app-shell {
      min-height: 100vh;
      display: flex;
      background: var(--bg);
    }

    .sidebar {
      width: 260px;
      background: #fafaf9;
      border-left: 1px solid rgba(0,0,0,.08);
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 10px;
      border-radius: 12px;
      background: rgba(30,122,52,.08);
      margin-bottom: 12px;
    }

    .logo {
      width: 38px; height: 38px; border-radius: 50%;
      background: linear-gradient(135deg, #d6b166, #9a6b1b);
      border: 2px solid #1d1d1d;
      position: relative;
    }
    .logo::before { content: ""; position: absolute; inset: 8px; border: 2px solid rgba(0,0,0,.65); border-radius: 50%; }
    .logo::after { content: ""; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 10px; height: 10px; border-radius: 50%; background: #1d1d1d; }

    .nav-btn {
      width: 100%;
      border: 1px solid transparent;
      background: transparent;
      color: #2d2d2d;
      font-weight: 700;
      border-radius: 12px;
      padding: 12px 10px;
      text-align: right;
      cursor: pointer;
    }
    .nav-btn.active {
      background: var(--green-soft);
      color: var(--green-dark);
      border-color: rgba(30,122,52,.10);
    }
    .nav-btn.hidden { display: none; }

    .main-panel {
      flex: 1;
      min-width: 0;
    }

    .topbar {
      background: #f3f3f2;
      border-bottom: 1px solid rgba(0,0,0,.08);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .topbar .left, .topbar .right {
      display: flex; align-items: center; gap: 12px;
    }

    .bell {
      width: 36px; height: 36px; border-radius: 12px; background: #1d1d1d; color: white;
      display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; user-select: none;
    }
    .bell-badge {
      position: absolute; right: 5px; top: 5px; min-width: 18px; height: 18px; border-radius: 999px;
      background: var(--red); color: white; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700;
      padding: 0 4px;
    }

    .user-chip {
      display: flex; align-items: center; gap: 8px;
      background: rgba(30,122,52,.07);
      border-radius: 12px;
      padding: 6px 10px;
    }
    .avatar {
      width: 30px; height: 30px; border-radius: 50%; background: var(--green); color: white; display: grid; place-items: center; font-weight: 700;
    }
    .user-meta small { display: block; color: var(--muted); }

    .page-wrap {
      max-width: 1200px; margin: 0 auto; padding: 18px 16px 80px;
    }

    .page { display: none; }
    .page.active { display: block; }

    .section-card {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: 0 10px 22px rgba(0,0,0,.03);
      margin-bottom: 18px;
    }

    .section-head {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap;
    }
    .section-title { font-size: 1.2rem; font-weight: 800; }

    .filters { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
    .input, .select { background: white; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 42px; }
    .search { min-width: 180px; flex: 1; }

    .btn {
      border: none; border-radius: 10px; padding: 10px 16px; font-weight: 700; cursor: pointer; background: #fff; border: 1px solid var(--line); color: #2d2d2d;
    }
    .btn-primary { background: var(--green); color: white; border-color: var(--green); }
    .btn-danger { background: var(--red); color: white; border-color: var(--red); }
    .btn-warning { background: var(--yellow); color: #3b2b05; border-color: var(--yellow); }
    .btn-outline { background: #fff; border: 1px solid var(--line); }
    .btn small { display: block; }

    .card-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px;
    }
    .stat-card {
      background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 8px;
    }
    .stat-top { display: flex; align-items: center; justify-content: space-between; font-size: 0.8rem; color: #3a413b; }
    .stat-value { font-size: 2rem; font-weight: 800; }
    .badge { display: inline-block; padding: 5px 8px; border-radius: 8px; font-size: 0.74rem; font-weight: 700; }
    .badge.green { background: #def7e9; color: #166b3a; }
    .badge.red { background: #fde2e2; color: #a92f2f; }
    .badge.yellow { background: #fff4d8; color: #8a5a10; }
    .badge.blue { background: #eaf2ff; color: #295db3; }

    table.list-table { width: 100%; border-collapse: collapse; }
    .list-table th, .list-table td { border-bottom: 1px solid var(--line); padding: 12px 10px; text-align: right; }
    .list-table th { background: #f5f7f5; }
    .list-table td.actions { white-space: nowrap; }

    .row-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px;
    }

    .field { display: flex; flex-direction: column; gap: 8px; }
    .field input, .field select { width: 100%; }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(10,15,11,.42); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 100;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      width: min(640px, 96vw); background: #fff; border-radius: 20px; box-shadow: var(--shadow); border: 1px solid rgba(0,0,0,.06); padding: 18px;
    }
    .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .close-btn { border: none; background: #f0f0f0; border-radius: 50%; width: 34px; height: 34px; cursor: pointer; font-size: 1.3rem; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; padding-top: 14px; margin-top: 14px; border-top: 1px solid var(--line); }

    .notify-box {
      border: 1px solid rgba(45,123,232,.2); background: var(--blue-soft); border-radius: 12px; padding: 12px; color: #225bb3; font-weight: 700;
      margin-top: 14px;
    }

    .alert-success { background: var(--green-soft); border: 1px solid rgba(30,122,52,.15); color: var(--green-dark); border-radius: 10px; padding: 10px 12px; font-weight: 700; }
    .alert-error { background: var(--red-soft); border: 1px solid rgba(214,74,74,.20); color: #953535; border-radius: 10px; padding: 10px 12px; font-weight: 700; }

    @media (max-width: 880px) {
      .app-shell { flex-direction: column; }
      .sidebar { width: 100%; border-left: none; border-bottom: 1px solid rgba(0,0,0,.08); }
      .main-panel { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="logo"></div>
        <div>
          <div style="font-size: 1.1rem; font-weight: 800;">اللواء 54</div>
          <div style="font-size: 0.75rem; color: var(--muted);">عمالقة</div>
        </div>
      </div>
      <button class="nav-btn active" data-page="dashboard">الرئيسية</button>
      <button class="nav-btn" data-page="attendance">التمام</button>
      <button class="nav-btn" data-page="leaves">الإجازات</button>
      <button class="nav-btn" data-page="personnel">الأفراد</button>
      <button class="nav-btn" data-page="cashier">الصرف</button>
      <button class="nav-btn" data-page="drafts">المسودات</button>
      <button class="nav-btn" data-page="users">إدارة المستخدمين</button>
    </aside>

    <main class="main-panel">
      <div class="topbar">
        <div class="left">
          <div class="bell" id="bellBtn" title="الإشعارات">
            🔔
            <div class="bell-badge hidden" id="notifBadge">0</div>
          </div>
        </div>
        <div class="right">
          <div class="user-chip">
            <div class="avatar" id="topAvatar">A</div>
            <div class="user-meta">
              <div id="topUserName">المدير</div>
              <small id="topUserRole">ركن الإدارة</small>
            </div>
          </div>
        </div>
      </div>

      <div class="page-wrap">
        <section id="loginPage" class="page active">
          <div class="section-card" style="max-width: 420px; margin: 120px auto 0;">
            <div class="section-head" style="justify-content:center; margin-bottom: 12px;">
              <div class="section-title">تسجيل الدخول</div>
            </div>
            <div class="row-grid" style="grid-template-columns: 1fr;">
              <div class="field">
                <label>اسم المستخدم</label>
                <input id="loginUsername" value="admin" />
              </div>
              <div class="field">
                <label>كلمة المرور</label>
                <input id="loginPassword" type="password" value="1234" />
              </div>
            </div>
            <div style="margin-top: 12px;">
              <button class="btn btn-primary" id="loginBtn" style="width:100%;">تسجيل الدخول</button>
            </div>
          </div>
        </section>

        <section id="dashboardPage" class="page">
          <div class="section-card">
            <div class="section-head">
              <div class="section-title">لوحة القيادة</div>
              <div class="badge blue">آخر تحديث اليوم</div>
            </div>
            <div id="dashboardCards" class="card-grid"></div>
          </div>

          <div class="section-card">
            <div class="section-head">
              <div class="section-title">آخر النشاطات</div>
            </div>
            <table class="list-table">
              <thead>
                <tr><th>الحدث</th><th>الوقت</th><th>المستخدم</th></tr>
              </thead>
              <tbody id="activityTable"></tbody>
            </table>
          </div>
        </section>

        <section id="attendancePage" class="page">
          <div class="section-card">
            <div class="section-head">
              <div class="section-title">التمام اليومي</div>
              <button class="btn btn-primary" id="markAllPresentBtn">تحديد الحضور</button>
            </div>
            <div class="filters">
              <input id="attendanceSearch" class="input search" placeholder="بحث بالاسم أو الرقم العسكري" />
              <select id="attendanceSquadFilter" class="select">
                <option value="all">كل السرايا</option>
              </select>
              <input type="date" id="attendanceDate" class="input" />
            </div>
            <div id="attendanceList"></div>
          </div>
        </section>

        <section id="leavesPage" class="page">
          <div class="section-card">
            <div class="section-head">
              <div class="section-title">إدارة الإجازات</div>
              <button class="btn btn-primary" id="newLeaveBtn">إضافة إجازة جديدة</button>
            </div>
            <div id="leavesList"></div>
          </div>
        </section>

        <section id="personnelPage" class="page">
          <div class="section-card">
            <div class="section-head">
              <div class="section-title">إدارة الأفراد</div>
              <button class="btn btn-primary" id="newPersonBtn">+ إضافة فرد جديد</button>
            </div>
            <div class="filters">
              <input id="personSearch" class="input search" placeholder="بحث" />
              <select id="teamFilter" class="select"><option value="all">كل الكتائب</option></select>
              <select id="squadFilter" class="select"><option value="all">كل السرايا</option></select>
            </div>
            <div id="personnelList"></div>
          </div>
        </section>

        <section id="cashierPage" class="page">
          <div class="section-card">
            <div class="section-head">
              <div class="section-title">الصرف</div>
              <span class="badge red">تم إغلاق الصندوق</span>
            </div>
            <div id="cashierCards" class="card-grid"></div>
            <div id="cashierList"></div>
          </div>
        </section>

        <section id="draftsPage" class="page">
          <div class="section-card">
            <div class="section-head">
              <div class="section-title">المسودات السفرية</div>
            </div>
            <div class="filters">
              <input id="draftName" class="input search" placeholder="اسم الفصيلة" />
              <button id="addDraftBtn" class="btn btn-primary">إضافة فصيلة</button>
            </div>
            <div id="draftList" class="row-grid"></div>
          </div>
        </section>

        <section id="usersPage" class="page">
          <div class="section-card">
            <div class="section-head">
              <div class="section-title">إدارة المستخدمين</div>
            </div>
            <div id="usersTable"></div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <div id="notifyModal" class="modal-overlay">
    <div class="modal">
      <div class="modal-head">
        <div class="section-title">سجل الإشعارات</div>
        <button class="close-btn" data-close="notifyModal">×</button>
      </div>
      <div id="notifyList"></div>
      <div class="modal-actions">
        <button class="btn btn-outline" data-close="notifyModal">إغلاق</button>
        <button class="btn btn-danger" id="clearNotifBtn">مسح الكل</button>
      </div>
    </div>
  </div>

  <div id="personModal" class="modal-overlay">
    <div class="modal">
      <div class="modal-head">
        <div class="section-title" id="personModalTitle">إضافة/تعديل فرد</div>
        <button class="close-btn" data-close="personModal">×</button>
      </div>
      <div class="row-grid">
        <div class="field"><label>الاسم الرباعي</label><input id="personName" /></div>
        <div class="field"><label>الرقم العسكري</label><input id="personNumber" /></div>
        <div class="field"><label>اسم المستخدم</label><input id="personUsername" /></div>
        <div class="field"><label>كلمة المرور</label><input id="personPassword" type="password" /></div>
        <div class="field"><label>رقم الجوال</label><input id="personPhone" placeholder="9665XXXXXXXX" /></div>
        <div class="field"><label>الكتيبة</label><input id="personTeam" /></div>
        <div class="field"><label>السرية</label><input id="personSquad" /></div>
        <div class="field"><label>الحالة</label><select id="personStatus"><option value="مفعل">مفعل</option><option value="غير مفعل">غير مفعل</option></select></div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" data-close="personModal">إلغاء</button>
        <button class="btn btn-primary" id="savePersonBtn">حفظ</button>
      </div>
    </div>
  </div>

  <div id="userModal" class="modal-overlay">
    <div class="modal">
      <div class="modal-head">
        <div class="section-title">تعديل مستخدم</div>
        <button class="close-btn" data-close="userModal">×</button>
      </div>
      <div class="row-grid">
        <div class="field"><label>اسم المستخدم</label><input id="userUsername" /></div>
        <div class="field"><label>كلمة المرور</label><input id="userPassword" type="password" /></div>
        <div class="field"><label>رقم الجوال</label><input id="userPhone" placeholder="9665XXXXXXXX" /></div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" data-close="userModal">إلغاء</button>
        <button class="btn btn-primary" id="saveUserBtn">حفظ</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'laawa_54_users_v1';
    const PERSONNEL_KEY = 'laawa_54_personnel_v1';
    const ATTENDANCE_KEY = 'laawa_54_attendance_v1';
    const LEAVES_KEY = 'laawa_54_leaves_v1';
    const DRAFTS_KEY = 'laawa_54_drafts_v1';
    const ACTIVITY_KEY = 'laawa_54_activity_v1';
    const NOTIFY_KEY = 'laawa_54_notifications_v1';
    const CURRENT_USER_KEY = 'laawa_54_current_user';

    const mapping = {
      admin: { title: 'الإدارة', roleType: 'admin' },
      hr_admin: { title: 'ركن البشرية', roleType: 'human' },
      financial: { title: 'ركن المالية', roleType: 'finance' },
      cashier: { title: 'الصرافين', roleType: 'cashier' },
      specialist: { title: 'المختصين', roleType: 'specialist' }
    };

    const defaultUsers = [
      { username: 'admin', password: '1234', role: 'admin', name: 'قائد اللواء', phone: '966500000000' },
      { username: 'بشرية', password: '1234', role: 'hr_admin', name: 'ركن البشرية', phone: '966511111111' },
      { username: 'مالية', password: '1234', role: 'financial', name: 'ركن المالية', phone: '966522222222' },
      { username: 'صراف', password: '1234', role: 'cashier', name: 'الصراف', phone: '966533333333' },
      { username: 'مختص', password: '1234', role: 'specialist', name: 'المختص', phone: '966544444444' }
    ];

    const defaultPersonnel = [
      { id: 1, name: 'عبد الرحمن وليد الشمري', number: '20001', username: 'a1', password: '1234', phone: '966599900001', team: 'ك1', squad: 'س1', status: 'مفعل' },
      { id: 2, name: 'طارق فارس السهلي', number: '20002', username: 'a2', password: '1234', phone: '966599900002', team: 'ك2', squad: 'س1', status: 'مفعل' },
      { id: 3, name: 'محمد حمد بن دغر', number: '20003', username: 'a3', password: '1234', phone: '966599900003', team: 'ك3', squad: 'س1', status: 'غير مفعل' }
    ];

    const defaultLeaves = [
      { id: 1, person: '20001 - عبد الرحمن وليد الشمري', type: 'إجازة', from: '2026-09-10', to: '2026-09-15', status: 'active' },
      { id: 2, person: '20002 - طارق فارس السهلي', type: 'مرضية', from: '2026-09-12', to: '', status: 'active' }
    ];

    const defaultAttendance = [
      { id: 1, name: 'عبد الرحمن وليد الشمري', number: '20001', team: 'ك1', squad: 'س1', status: 'حاضر', date: '2026-09-29' },
      { id: 2, name: 'طارق فارس السهلي', number: '20002', team: 'ك2', squad: 'س1', status: 'غائب', date: '2026-09-29' },
      { id: 3, name: 'محمد حمد بن دغر', number: '20003', team: 'ك3', squad: 'س1', status: 'حاضر', date: '2026-09-29' }
    ];

    const defaultDrafts = [
      { id: 1, title: 'فصيلة محمد', count: 12, color: 'blue' },
      { id: 2, title: 'فصيلة فهد', count: 9, color: 'green' }
    ];

    const defaultActivity = [
      { text: 'تم تحديث بيانات فرد', time: '09:12', user: 'ركن البشرية' }
    ];

    const app = {
      users: loadStorage(STORAGE_KEY, defaultUsers),
      personnel: loadStorage(PERSONNEL_KEY, defaultPersonnel),
      attendance: loadStorage(ATTENDANCE_KEY, defaultAttendance),
      leaves: loadStorage(LEAVES_KEY, defaultLeaves),
      drafts: loadStorage(DRAFTS_KEY, defaultDrafts),
      activity: loadStorage(ACTIVITY_KEY, defaultActivity),
      notifications: loadStorage(NOTIFY_KEY, []),
      currentUser: JSON.parse(localStorage.getItem(CURRENT_USER_KEY) || 'null'),
      activePage: 'dashboard',
      activeEditUserIndex: null,
      activeEditPersonId: null
    };

    function loadStorage(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return JSON.parse(JSON.stringify(fallback));
        return JSON.parse(raw);
      } catch (e) {
        return JSON.parse(JSON.stringify(fallback));
      }
    }

    function saveStorage(key, value) {
      localStorage.setItem(key, JSON.stringify(value));
    }

    function getRoleTitle(role) {
      return mapping[role]?.title || role;
    }

    function getOutboundRole(section) {
      const bySection = {
        personnel: 'hr_admin',
        leaves: 'hr_admin',
        attendance: 'specialist',
        cashier: 'financial',
        drafts: 'financial',
        users: 'admin'
      };
      return bySection[section] || 'admin';
    }

    function normalizePhoneValue(value) {
      return String(value || '').replace(/\D/g, '').replace(/^0+/, '');
    }

    function getRoleLabel(role) {
      return 'ركن ' + (mapping[role]?.title || role);
    }

    function canViewPage(page) {
      const role = app.currentUser?.role;
      const pages = {
        dashboard: ['admin', 'hr_admin', 'financial', 'cashier', 'specialist'],
        attendance: ['admin', 'hr_admin', 'specialist'],
        leaves: ['admin', 'hr_admin'],
        personnel: ['admin', 'hr_admin'],
        cashier: ['admin', 'financial', 'cashier'],
        drafts: ['admin', 'financial'],
        users: ['admin']
      };
      return !!role && !!pages[page] && pages[page].includes(role);
    }

    function canModifySection(section) {
      const role = app.currentUser?.role;
      const map = {
        personnel: ['admin', 'hr_admin'],
        leaves: ['admin', 'hr_admin'],
        attendance: ['admin', 'hr_admin', 'specialist'],
        cashier: ['admin', 'financial', 'cashier'],
        drafts: ['admin', 'financial'],
        users: ['admin']
      };
      if (!role) return false;
      return !!map[section] && map[section].includes(role);
    }

    function showPage(page) {
      if (!canViewPage(page)) {
        alert('ليس لديك صلاحية الدخول إلى هذا القسم');
        return;
      }
      app.activePage = page;
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.page === page));
      document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === page + 'Page' || (page === 'dashboard' && p.id === 'dashboardPage')));
      if (page === 'dashboard' || page === 'attendance' || page === 'leaves' || page === 'personnel' || page === 'cashier' || page === 'drafts' || page === 'users') {
        document.getElementById('loginPage').classList.add('hidden');
      }
      renderAll();
    }

    function renderUserMenu() {
      if (!app.currentUser) return;
      const userName = app.currentUser.name || app.currentUser.username;
      document.getElementById('topUserName').textContent = userName;
      document.getElementById('topUserRole').textContent = getRoleLabel(app.currentUser.role);
      document.getElementById('topAvatar').textContent = String(userName).charAt(0).toUpperCase();
    }

    function renderNavs() {
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.toggle('hidden', !canViewPage(btn.dataset.page));
        btn.classList.toggle('active', btn.dataset.page === app.activePage);
      });
    }

    function renderAll() {
      renderUserMenu();
      renderNavs();
      renderDashboard();
      renderAttendance();
      renderLeaves();
      renderPersonnel();
      renderCashier();
      renderDrafts();
      renderUsersTable();
      renderNotificationsBell();
    }

    function renderDashboard() {
      const total = app.personnel.length;
      const present = app.personnel.filter(p => p.status === 'مفعل').length;
      const absent = app.personnel.filter(p => p.status === 'غير مفعل').length;
      const cards = [
        { label: 'إجمالي الأفراد', value: total, tone: 'green' },
        { label: 'مفعل', value: present, tone: 'green' },
        { label: 'غير مفعل', value: absent, tone: 'red' },
        { label: 'الإجازات', value: app.leaves.length, tone: 'yellow' }
      ];
      document.getElementById('dashboardCards').innerHTML = cards.map(c => `
        <div class="stat-card">
          <div class="stat-top"><span>${c.label}</span><span class="badge ${c.tone}">${c.value}</span></div>
          <div class="stat-value">${c.value}</div>
          <div class="muted">إحصاء اليوم</div>
        </div>
      `).join('');

      document.getElementById('activityTable').innerHTML = app.activity.slice(0, 8).map(item => `
        <tr>
          <td>${item.text}</td>
          <td>${item.time}</td>
          <td>${item.user}</td>
        </tr>
      `).join('');
    }

    function renderAttendance() {
      const search = (document.getElementById('attendanceSearch')?.value || '').toLowerCase();
      const squad = (document.getElementById('attendanceSquadFilter')?.value || 'all');
      const selectedDate = (document.getElementById('attendanceDate')?.value || new Date().toISOString().slice(0,10));

      const filter = app.attendance.filter(row => {
        const matchesText = !search || row.name.toLowerCase().includes(search) || String(row.number).includes(search);
        const matchesSquad = squad === 'all' || row.squad === squad;
        const matchesDate = !selectedDate || row.date === selectedDate;
        return matchesText && matchesSquad && matchesDate;
      });

      const squadOptions = ['all', ...new Set(app.attendance.map(x => x.squad))];
      const squadSelect = document.getElementById('attendanceSquadFilter');
      if (squadSelect) {
        squadSelect.innerHTML = squadOptions.map(v => `<option value="${v}">${v === 'all' ? 'كل السرايا' : v}</option>`).join('');
        squadSelect.value = squad;
      }

      const rows = filter.map(item => `
        <div class="section-card" style="margin-bottom: 12px;">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
            <div><strong>${item.name}</strong></div>
            <span class="badge ${item.status === 'حاضر' ? 'green' : 'red'}">${item.status}</span>
          </div>
          <div style="margin-top: 8px; color: var(--muted);">${item.number} • ${item.team} / ${item.squad} • ${item.date}</div>
        </div>
      `).join('');
      document.getElementById('attendanceList').innerHTML = rows || '<div class="alert-error">لا توجد نتائج</div>';
    }

    function renderLeaves() {
      const rows = app.leaves.map(item => `
        <tr>
          <td class="actions">
            <button class="btn btn-outline" data-action="edit-leave" data-id="${item.id}">تعديل</button>
            <button class="btn btn-danger" data-action="delete-leave" data-id="${item.id}">حذف</button>
          </td>
          <td><span class="badge ${item.status === 'active' ? 'green' : 'yellow'}">${item.status === 'active' ? 'سارية' : 'منتهية'}</span></td>
          <td>${item.from} ${item.to ? 'إلى ' + item.to : 'إلى مفتوح'}</td>
          <td>${item.type}</td>
          <td>${item.person}</td>
        </tr>
      `).join('');
      document.getElementById('leavesList').innerHTML = `
        <table class="list-table">
          <thead><tr><th>الإجراءات</th><th>الحالة</th><th>التاريخ</th><th>النوع</th><th>الاسم</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>`;

      document.querySelectorAll('[data-action="delete-leave"]').forEach(btn => {
        btn.onclick = () => {
          if (!canModifySection('leaves')) { alert('ليس لديك صلاحية حذف الإجازات'); return; }
          const id = Number(btn.dataset.id);
          app.leaves = app.leaves.filter(x => x.id !== id);
          saveStorage(LEAVES_KEY, app.leaves);
          recordNotification('حذف', 'إجازة', 'leaves', 'hr_admin');
          renderLeaves();
        };
      });
    }

    function renderPersonnel() {
      const search = (document.getElementById('personSearch')?.value || '').toLowerCase();
      const team = (document.getElementById('teamFilter')?.value || 'all');
      const squad = (document.getElementById('squadFilter')?.value || 'all');

      const teamOptions = ['all', ...new Set(app.personnel.map(x => x.team))];
      const squadOptions = ['all', ...new Set(app.personnel.map(x => x.squad))];
      const teamFilter = document.getElementById('teamFilter');
      const squadFilter = document.getElementById('squadFilter');
      if (teamFilter) {
        teamFilter.innerHTML = teamOptions.map(v => `<option value="${v}">${v === 'all' ? 'كل الكتائب' : v}</option>`).join('');
        teamFilter.value = team;
      }
      if (squadFilter) {
        squadFilter.innerHTML = squadOptions.map(v => `<option value="${v}">${v === 'all' ? 'كل السرايا' : v}</option>`).join('');
        squadFilter.value = squad;
      }

      const list = app.personnel.filter(item => {
        const textMatch = !search || item.name.toLowerCase().includes(search) || String(item.number).includes(search);
        const teamMatch = team === 'all' || item.team === team;
        const squadMatch = squad === 'all' || item.squad === squad;
        return textMatch && teamMatch && squadMatch;
      });

      document.getElementById('personnelList').innerHTML = list.map(item => `
        <div class="section-card" style="margin-bottom: 12px;">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
            <div><strong>${item.name}</strong> (${item.number})</div>
            <span class="badge ${item.status === 'مفعل' ? 'green' : 'red'}">${item.status}</span>
          </div>
          <div style="margin-top: 8px; color: var(--muted);">${item.team} / ${item.squad} • ${item.phone || 'لا يوجد رقم جوال'}</div>
          <div style="margin-top: 12px; display:flex; gap:8px;">
            <button class="btn btn-outline" data-action="edit-person" data-id="${item.id}">تعديل</button>
            <button class="btn btn-danger" data-action="delete-person" data-id="${item.id}">حذف</button>
          </div>
        </div>
      `).join('') || '<div class="alert-error">لا توجد نتائج</div>';

      document.querySelectorAll('[data-action="edit-person"]').forEach(btn => {
        btn.onclick = () => openPersonModal(Number(btn.dataset.id));
      });

      document.querySelectorAll('[data-action="delete-person"]').forEach(btn => {
        btn.onclick = () => {
          if (!canModifySection('personnel')) { alert('ليس لديك صلاحية حذف الأفراد'); return; }
          const id = Number(btn.dataset.id);
          const person = app.personnel.find(x => x.id === id);
          app.personnel = app.personnel.filter(x => x.id !== id);
          saveStorage(PERSONNEL_KEY, app.personnel);
          recordNotification('حذف', `فرد ${person ? person.name : id}`, 'personnel', 'hr_admin');
          renderPersonnel();
        };
      });
    }

    function renderCashier() {
      const cards = [
        { label: 'عدد المستحقين', value: app.personnel.length, tone: 'blue' },
        { label: 'المستلمون', value: Math.max(0, app.personnel.length - 1), tone: 'green' },
        { label: 'النسبة', value: Math.round(((app.personnel.length - 1) / Math.max(1, app.personnel.length)) * 100) + '%', tone: 'yellow' }
      ];
      document.getElementById('cashierCards').innerHTML = cards.map(c => `
        <div class="stat-card">
          <div class="stat-top"><span>${c.label}</span><span class="badge ${c.tone}">${c.value}</span></div>
          <div class="stat-value">${c.value}</div>
          <div style="color: var(--muted);">تحديث فوري</div>
        </div>
      `).join('');

      document.getElementById('cashierList').innerHTML = app.personnel.map(item => `
        <div class="section-card" style="margin-bottom: 10px;">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;">
            <div><strong>${item.name}</strong> (${item.number})</div>
            <button class="btn btn-primary" data-cash="${item.id}">تسجيل استلام المستحقات</button>
          </div>
        </div>
      `).join('');

      document.querySelectorAll('[data-cash]').forEach(btn => {
        btn.onclick = () => {
          if (!canModifySection('cashier')) { alert('ليس لديك صلاحية في الصرف'); return; }
          const id = Number(btn.dataset.cash);
          const person = app.personnel.find(x => x.id === id);
          recordNotification('تحديث', `استلام مستحقات ${person ? person.name : ''}`, 'cashier', 'financial');
          alert('تم تسجيل الاستلام بنجاح');
        };
      });
    }

    function renderDrafts() {
      document.getElementById('draftList').innerHTML = app.drafts.map(d => `
        <div class="section-card" style="background: linear-gradient(180deg, #edf7ff, #fff); margin-bottom: 0;">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
            <strong>${d.title}</strong>
            <span class="badge blue">${d.count}</span>
          </div>
          <div style="margin-top: 12px; display:flex; gap:8px;">
            <button class="btn btn-outline" data-draft="edit" data-id="${d.id}">تعديل</button>
            <button class="btn btn-danger" data-draft="delete" data-id="${d.id}">حذف</button>
          </div>
        </div>
      `).join('') || '<div class="alert-error">لا توجد مسودات</div>';

      document.querySelectorAll('[data-draft="delete"]').forEach(btn => btn.onclick = () => {
        if (!canModifySection('drafts')) { alert('ليس لديك صلاحية حذف المسودات'); return; }
        const id = Number(btn.dataset.id);
        app.drafts = app.drafts.filter(x => x.id !== id);
        saveStorage(DRAFTS_KEY, app.drafts);
        recordNotification('حذف', 'مسودة', 'drafts', 'financial');
        renderDrafts();
      });
    }

    function renderUsersTable() {
      if (app.currentUser?.role !== 'admin') { document.getElementById('usersTable').innerHTML = ''; return; }
      const rows = app.users.map((user, idx) => `
        <tr>
          <td class="actions"><button class="btn btn-outline" data-user-edit="${idx}">تعديل</button></td>
          <td>${user.phone || ''}</td>
          <td>${user.name || user.username}</td>
          <td>${user.username}</td>
          <td>${getRoleTitle(user.role)}</td>
        </tr>
      `).join('');
      document.getElementById('usersTable').innerHTML = `
        <table class="list-table">
          <thead><tr><th>الإجراءات</th><th>رقم الجوال</th><th>الاسم</th><th>اسم المستخدم</th><th>الوظيفة</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>`;

      document.querySelectorAll('[data-user-edit]').forEach(btn => {
        btn.onclick = () => {
          const idx = Number(btn.getAttribute('data-user-edit'));
          const user = app.users[idx];
          app.activeEditUserIndex = idx;
          document.getElementById('userUsername').value = user.username;
          document.getElementById('userPassword').value = user.password;
          document.getElementById('userPhone').value = user.phone || '';
          document.getElementById('userModal').classList.add('open');
        };
      });
    }

    function openPersonModal(id) {
      if (!canModifySection('personnel')) { alert('ليس لديك صلاحية تعديل الأفراد'); return; }
      const person = app.personnel.find(item => item.id === id) || {};
      app.activeEditPersonId = id || null;
      document.getElementById('personModalTitle').textContent = id ? 'تعديل فرد' : 'إضافة فرد';
      document.getElementById('personName').value = person.name || '';
      document.getElementById('personNumber').value = person.number || '';
      document.getElementById('personUsername').value = person.username || '';
      document.getElementById('personPassword').value = person.password || '';
      document.getElementById('personPhone').value = person.phone || '';
      document.getElementById('personTeam').value = person.team || '';
      document.getElementById('personSquad').value = person.squad || '';
      document.getElementById('personStatus').value = person.status || 'مفعل';
      document.getElementById('personModal').classList.add('open');
    }

    function recordNotification(action, target, section, notifyRole) {
      const actor = app.currentUser || { name: 'النظام', username: 'system' };
      const n = {
        id: Date.now() + Math.random(),
        from: actor.name || actor.username,
        action,
        target,
        section,
        when: new Date().toLocaleString('ar-EG'),
        role: notifyRole || getOutboundRole(section)
      };
      app.notifications.unshift(n);
      saveStorage(NOTIFY_KEY, app.notifications);

      app.activity.unshift({ text: `${n.from} ${n.action} ${n.target}`, time: new Date().toLocaleTimeString('ar-EG'), user: n.from });
      saveStorage(ACTIVITY_KEY, app.activity);

      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification('إشعار جديد', { body: `${n.from} ${n.action} ${n.target} • ${n.when}` });
      }
      renderNotificationsBell();
      renderDashboard();
    }

    function renderNotificationsBell() {
      const count = app.notifications.length;
      const badge = document.getElementById('notifBadge');
      badge.textContent = count > 99 ? '99+' : count;
      badge.classList.toggle('hidden', count === 0);
    }

    function openNotifications() {
      const list = app.notifications;
      document.getElementById('notifyList').innerHTML = list.length ? list.map(item => `
        <div class="section-card" style="margin-bottom: 8px; padding: 12px;">
          <div><strong>${item.from}</strong> ${item.action} ${item.target}</div>
          <div style="color: var(--muted); margin-top: 6px;">${item.when}</div>
          <div style="margin-top: 10px; display:flex; gap:8px; flex-wrap: wrap;">
            ${renderNotifyButtons(item)}
          </div>
        </div>
      `).join('') : '<div class="alert-error">لا توجد إشعارات</div>';
      document.getElementById('notifyModal').classList.add('open');
    }

    function renderNotifyButtons(item) {
      const phone = (app.users.find(u => u.role === item.role) || app.users[0])?.phone || '';
      const safePhone = normalizePhoneValue(phone);
      const text = encodeURIComponent(`${item.from} ${item.action} ${item.target} • ${item.when}`);
      const waLink = safePhone ? `https://wa.me/${safePhone}?text=${text}` : '#';
      const smsLink = safePhone ? `sms:${safePhone}?body=${text}` : '#';
      return `
        ${safePhone ? `<a class="btn btn-primary" href="${waLink}" target="_blank">إرسال إشعار واتساب</a>` : ''}
        ${safePhone ? `<a class="btn btn-outline" href="${smsLink}">إرسال SMS</a>` : ''}
      `;
    }

    function requestBrowserPermission() {
      if (!('Notification' in window)) return;
      if (Notification.permission === 'default') {
        Notification.requestPermission().then(() => {});
      }
    }

    document.getElementById('bellBtn').onclick = openNotifications;
    document.querySelectorAll('[data-close="notifyModal"]').forEach(btn => btn.onclick = () => document.getElementById('notifyModal').classList.remove('open'));
    document.querySelectorAll('[data-close="personModal"]').forEach(btn => btn.onclick = () => document.getElementById('personModal').classList.remove('open'));
    document.querySelectorAll('[data-close="userModal"]').forEach(btn => btn.onclick = () => document.getElementById('userModal').classList.remove('open'));

    document.getElementById('loginBtn').onclick = () => {
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;
      const user = app.users.find(item => item.username === username && item.password === password);
      if (!user) return alert('اسم المستخدم أو كلمة المرور غير صحيحة');
      app.currentUser = user;
      localStorage.setItem(CURRENT_USER_KEY, JSON.stringify(user));
      requestBrowserPermission();
      document.getElementById('loginPage').classList.add('hidden');
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('dashboardPage').classList.add('active');
      app.activePage = 'dashboard';
      renderAll();
    };

    document.getElementById('newPersonBtn').onclick = () => openPersonModal(null);
    document.getElementById('savePersonBtn').onclick = () => {
      const personData = {
        name: document.getElementById('personName').value.trim(),
        number: document.getElementById('personNumber').value.trim(),
        username: document.getElementById('personUsername').value.trim(),
        password: document.getElementById('personPassword').value,
        phone: normalizePhoneValue(document.getElementById('personPhone').value),
        team: document.getElementById('personTeam').value.trim(),
        squad: document.getElementById('personSquad').value.trim(),
        status: document.getElementById('personStatus').value,
      };

      if (!personData.name || !personData.number) {
        alert('يرجى إدخال الاسم والرقم العسكري');
        return;
      }
      if (!canModifySection('personnel')) {
        alert('ليس لديك صلاحية لإضافة أو تعديل الأفراد');
        return;
      }

      if (app.activeEditPersonId) {
        app.personnel = app.personnel.map(item => item.id === app.activeEditPersonId ? { ...item, ...personData } : item);
        saveStorage(PERSONNEL_KEY, app.personnel);
        recordNotification('عدّل', `بيانات فرد ${personData.number}`, 'personnel', 'hr_admin');
      } else {
        const nextId = app.personnel.reduce((max, item) => Math.max(max, item.id || 0), 0) + 1;
        app.personnel.unshift({ id: nextId, ...personData });
        saveStorage(PERSONNEL_KEY, app.personnel);
        recordNotification('أضاف', `فرد ${personData.number}`, 'personnel', 'hr_admin');
      }

      document.getElementById('personModal').classList.remove('open');
      renderAll();
    };

    document.getElementById('newLeaveBtn').onclick = () => {
      if (!canModifySection('leaves')) { alert('ليس لديك صلاحية إضافة الإجازات'); return; }
      const personName = prompt('اسم الفرد أو الرقم العسكري؟');
      if (!personName) return;
      const type = prompt('نوع الإجازة؟ مثال: إجازة / مرضية / هروب', 'إجازة');
      const from = prompt('تاريخ البداية yyyy-mm-dd', new Date().toISOString().slice(0,10));
      const to = prompt('تاريخ النهاية yyyy-mm-dd (فارغ إن لم يحدد)', '');
      const nextId = (app.leaves.reduce((max, item) => Math.max(max, item.id || 0), 0) + 1);
      app.leaves.unshift({ id: nextId, person: personName, type: type || 'إجازة', from: from || new Date().toISOString().slice(0,10), to: to || '', status: 'active' });
      saveStorage(LEAVES_KEY, app.leaves);
      recordNotification('أضاف', `إجازة ${personName}`, 'leaves', 'hr_admin');
      renderAll();
    };

    document.getElementById('markAllPresentBtn').onclick = () => {
      if (!canModifySection('attendance')) { alert('ليس لديك صلاحية تعديل الحضور'); return; }
      app.attendance = app.attendance.map(item => ({ ...item, status: 'حاضر' }));
      saveStorage(ATTENDANCE_KEY, app.attendance);
      recordNotification('عدّل', 'حضور اليوم', 'attendance', 'specialist');
      renderAll();
    };

    document.getElementById('addDraftBtn').onclick = () => {
      if (!canModifySection('drafts')) { alert('ليس لديك صلاحية إضافة المسودات'); return; }
      const title = document.getElementById('draftName').value.trim();
      if (!title) return alert('أدخل اسم الفصيلة');
      const nextId = (app.drafts.reduce((max, item) => Math.max(max, item.id || 0), 0) + 1);
      app.drafts.push({ id: nextId, title, count: 0, color: 'blue' });
      saveStorage(DRAFTS_KEY, app.drafts);
      recordNotification('أضاف', `مسودة ${title}`, 'drafts', 'financial');
      renderAll();
      document.getElementById('draftName').value = '';
    };

    document.getElementById('clearNotifBtn').onclick = () => {
      app.notifications = [];
      saveStorage(NOTIFY_KEY, app.notifications);
      renderNotificationsBell();
      openNotifications();
    };

    document.getElementById('saveUserBtn').onclick = () => {
      if (app.currentUser?.role !== 'admin') { alert('فقط admin يمكنه تعديل المستخدمين'); return; }
      const idx = app.activeEditUserIndex;
      if (idx === null || idx === undefined) return;
      const updated = {
        ...app.users[idx],
        username: document.getElementById('userUsername').value.trim(),
        password: document.getElementById('userPassword').value,
        phone: normalizePhoneValue(document.getElementById('userPhone').value)
      };
      if (!updated.username || !updated.password) {
        alert('اسم المستخدم وكلمة المرور مطلوبان');
        return;
      }
      app.users[idx] = updated;
      saveStorage(STORAGE_KEY, app.users);
      document.getElementById('userModal').classList.remove('open');
      recordNotification('عدّل', `مستخدم ${updated.username}`, 'users', 'admin');
      renderAll();
    };

    document.getElementById('clientPanelBtn')?.addEventListener('click', () => {});

    document.getElementById('attendanceSearch').addEventListener('input', renderAttendance);
    document.getElementById('attendanceSquadFilter').addEventListener('change', renderAttendance);
    document.getElementById('attendanceDate').addEventListener('change', renderAttendance);
    document.getElementById('personSearch').addEventListener('input', renderPersonnel);
    document.getElementById('teamFilter').addEventListener('change', renderPersonnel);
    document.getElementById('squadFilter').addEventListener('change', renderPersonnel);

    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => showPage(btn.dataset.page));
    });

    renderAll();
    if (!app.currentUser) {
      document.getElementById('loginPage').classList.remove('hidden');
      document.getElementById('dashboardPage').classList.remove('active');
    } else {
      showPage('dashboard');
    }
  </script>
</body>
</html>
